version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - DJANGO_SETTINGS_MODULE=catalog_admin.settings
    depends_on:
      - db

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: my_catalogs
      MYSQL_USER: admin
      MYSQL_PASSWORD: 5R2vphq5eBpF6NyYtnUT
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"